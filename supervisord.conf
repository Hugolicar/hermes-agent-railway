[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:hermes-dashboard]
# Bind on 0.0.0.0 (not 127.0.0.1) so the upstream's auth gate engages.
# should_require_auth() in hermes_cli/web_server.py returns True only on
# non-loopback binds; a 127.0.0.1 bind deliberately bypasses the gate
# ("dev mode" heuristic) which leaves the dashboard wide open even
# though providers are registered. The auth_proxy on :8080 is the only
# public-facing listener; the upstream on :9119 stays unexposed.
command=hermes dashboard --host 0.0.0.0 --port 9119 --no-open
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/hermes-dashboard.log
stderr_logfile=/var/log/supervisor/hermes-dashboard.log

[program:auth-proxy]
command=python /auth_proxy.py
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/auth-proxy.log
stderr_logfile=/var/log/supervisor/auth-proxy.log
environment=PORT="8080"

[program:filebrowser]
command=/entrypoint.sh filebrowser
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/filebrowser.log
stderr_logfile=/var/log/supervisor/filebrowser.log
