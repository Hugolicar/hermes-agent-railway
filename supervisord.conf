[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:hermes-dashboard]
command=hermes dashboard --host 127.0.0.1 --port 9119 --no-open
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/hermes-dashboard.log
stderr_logfile=/var/log/supervisor/hermes-dashboard.log

[program:auth-proxy]
command=python /auth_proxy.py
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/auth-proxy.log
stderr_logfile=/var/log/supervisor/auth-proxy.log
environment=PORT="%(ENV_PORT)s",DASHBOARD_USER="%(ENV_DASHBOARD_USER)s",DASHBOARD_PASSWORD="%(ENV_DASHBOARD_PASSWORD)s"

[program:filebrowser]
command=/entrypoint.sh filebrowser
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/filebrowser.log
stderr_logfile=/var/log/supervisor/filebrowser.log
